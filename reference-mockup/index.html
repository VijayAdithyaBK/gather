<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f3">
<title>Gather — your good things, together</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f8f7f3;--ink:#191917;--muted:#85847e;--line:#d9d7d0;--orange:#e24a37;--lime:#d9f36c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:0 42px}.top{height:100px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--ink)}.wordmark{font-weight:800;letter-spacing:-.075em;font-size:37px}.wordmark i{font-style:normal;color:var(--orange)}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:29px;height:29px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:16px}.nav{justify-self:end;display:flex;gap:25px;align-items:center;font:11px 'DM Mono',monospace;text-transform:uppercase}.nav a{color:inherit;text-decoration:none}.nav button{background:none;border:0;font:inherit;text-transform:uppercase}.intro{padding:52px 0 36px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font:11px 'DM Mono',monospace;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.intro h1{font-size:clamp(43px,6vw,78px);line-height:.93;letter-spacing:-.075em;margin:14px 0 0;font-weight:600}.intro h1 span{color:var(--orange)}.intro-aside{font-size:13px;color:var(--muted);line-height:1.6;max-width:230px;padding-bottom:5px}.addbar{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid var(--ink);padding:7px;margin:0 0 30px;background:#fff}.addbar input{border:0;outline:0;padding:13px 14px;font-size:14px;min-width:0;background:transparent}.addbar input::placeholder{color:#aaa9a2}.addbar button,.primary{border:0;background:var(--ink);color:white;padding:0 22px;font:11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.04em}.addbar button:hover,.primary:hover{background:var(--orange)}.categories{display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--ink);padding:0 0 14px;margin-bottom:12px;overflow:auto}.chip{border:1px solid var(--ink);border-radius:99px;padding:8px 15px;background:transparent;color:var(--ink);white-space:nowrap;font:10px 'DM Mono',monospace;text-transform:uppercase}.chip.active{background:var(--orange);border-color:var(--orange);color:white}.count{margin-left:auto;color:var(--muted);font:10px 'DM Mono',monospace;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-left:1px solid var(--line)}.card{position:relative;min-width:0;padding:12px 12px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.photo{height:clamp(170px,22vw,310px);position:relative;display:grid;place-items:center;overflow:hidden;background:var(--tone,#eeece5);text-decoration:none}.photo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s}.card:hover .photo img{transform:scale(1.035)}.photo .fallback{font-size:76px;filter:drop-shadow(0 12px 10px #0002)}.badge{position:absolute;left:10px;top:10px;border-radius:100px;background:white;padding:6px 9px;font:9px 'DM Mono',monospace;text-transform:uppercase}.heart{position:absolute;right:10px;top:9px;border:0;border-radius:50%;width:31px;height:31px;background:#ffffffd9;font-size:16px}.meta{min-height:79px;padding:12px 2px 11px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}.title{font-size:12px;font-weight:700;line-height:1.35;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.store{font:9px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase;margin-top:4px}.price{font-size:12px;font-weight:600;margin-top:5px}.card-actions{position:absolute;right:8px;bottom:10px;display:flex;gap:4px;opacity:0;transition:opacity .2s}.card:hover .card-actions{opacity:1}.iconbtn{width:27px;height:27px;border:1px solid var(--line);background:var(--paper);border-radius:50%}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);font-size:14px}.foot{display:flex;justify-content:space-between;padding:22px 0 38px;font:10px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase}.modal-back{position:fixed;inset:0;background:#1118;display:none;place-items:center;padding:20px;z-index:5}.modal-back.open{display:grid}.modal{background:var(--paper);width:min(510px,100%);padding:28px}.modal h2{font-size:26px;letter-spacing:-.05em;margin:0 0 4px}.modal p{font-size:13px;color:var(--muted);margin:0 0 20px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font:10px 'DM Mono',monospace;text-transform:uppercase}.form input,.form select{border:1px solid var(--line);padding:12px;background:#fff;outline-color:var(--orange);font:13px 'DM Sans',sans-serif}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;justify-content:space-between;margin-top:7px}.form-actions button{padding:12px 16px}.textbtn{border:0;background:none;font:10px 'DM Mono',monospace;text-transform:uppercase}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;font:11px 'DM Mono',monospace;z-index:8;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding:0 25px}}@media(max-width:620px){.shell{padding:0 15px}.top{height:74px}.wordmark{font-size:29px}.nav{gap:13px;font-size:10px}.intro{padding:38px 0 25px;display:block}.intro-aside{margin-top:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:53vw}.count{display:none}.addbar button{padding:0 13px}.card{padding-left:8px;padding-right:8px}}
</style></head>
<body><div class="shell"><header class="top"><div class="wordmark">gather<span>.</span></div><div class="brand"><span class="brand-mark">✳</span><span class="eyebrow">the wishlist club</span></div><nav class="nav"><a href="#collection">Collection</a><button id="share">Share ↗</button></nav></header>
<main><section class="intro"><div><div class="eyebrow">A little corner for things you love</div><h1>Want it.<br><span>Save it.</span> Find it.</h1></div><div class="intro-aside">Every good find, from everywhere.<br>All in one lovely place.</div></section>
<form class="addbar" id="url-form"><input id="url-input" type="url" placeholder="Paste a product link from anywhere… (Amazon, Myntra, and more)" required><button type="submit">＋ Add a find</button></form>
<section id="collection"><div class="categories" id="categories"><button class="chip active" data-filter="All">All <span id="all-n"></span></button><button class="chip" data-filter="Clothing">Clothing</button><button class="chip" data-filter="Bags">Bags</button><button class="chip" data-filter="Accessories">Accessories</button><button class="chip" data-filter="Home">Home</button><button class="chip" data-filter="Books">Books</button><button class="count" id="count"></button></div><div class="grid" id="grid"></div></section></main><footer class="foot"><span>Good things, gathered.</span><span id="footer-count">0 finds saved</span></footer></div>
<div class="modal-back" id="modal-back"><div class="modal"><h2>Make it yours.</h2><p>We found what we could. Add or adjust any details before saving.</p><form id="product-form" class="form"><input type="hidden" id="p-url"><label>Product name<input id="p-title" placeholder="What caught your eye?" required></label><div class="row"><label>Price<input id="p-price" placeholder="e.g. ₹2,499"></label><label>Collection<select id="p-category"><option>Clothing</option><option>Bags</option><option>Accessories</option><option>Home</option><option>Books</option><option>Other</option></select></label></div><label>Image URL<input id="p-image" placeholder="Optional — paste an image link"></label><div class="form-actions"><button class="textbtn" type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save to my list ↗</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{title:'Everyday canvas tote',price:'₹1,290',category:'Bags',store:'Studio Nicholson',emoji:'👜',tone:'#eee7dd'},
{title:'Soft form, sculptural vase',price:'₹3,800',category:'Home',store:'Objects for Objects',emoji:'🏺',tone:'#e9e5dd'},
{title:'The Creative Act',price:'₹699',category:'Books',store:'Bookshop',emoji:'📖',tone:'#ece8dc'},
{title:'Little gold hoops',price:'₹2,250',category:'Accessories',store:'Misho',emoji:'💍',tone:'#f0e9d8'},
{title:'Sunday striped shirt',price:'₹2,499',category:'Clothing',store:'Mango',emoji:'👔',tone:'#e4e9e5'},
{title:'A scent for slow mornings',price:'₹4,200',category:'Home',store:'Naso Profumi',emoji:'🕯️',tone:'#eee8dc'},
{title:'Market day shoulder bag',price:'₹3,490',category:'Bags',store:'Ofr Paris',emoji:'👝',tone:'#eee3da'},
{title:'The Kinfolk Garden',price:'₹2,100',category:'Books',store:'Amazon',emoji:'📚',tone:'#e5e9dc'},
{title:'Silver everyday chain',price:'₹1,850',category:'Accessories',store:'Myntra',emoji:'📿',tone:'#ebe8e4'},
{title:'Easy linen trousers',price:'₹3,299',category:'Clothing',store:'Nicobar',emoji:'👖',tone:'#e9e5db'}];
let items=JSON.parse(localStorage.getItem('gather-items')||'null')||seed.map((x,i)=>({...x,id:'seed'+i,url:'',image:''}));let filter='All';const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('gather-items',JSON.stringify(items));render()}function render(){let shown=items.filter(x=>filter==='All'||x.category===filter);$('#grid').innerHTML=shown.length?shown.map(x=>`<article class="card"><a class="photo" href="${esc(x.url||'#')}" target="_blank" rel="noreferrer" style="--tone:${esc(x.tone||'#eeece5')}">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" onerror="this.remove()">`:`<span class="fallback">${esc(x.emoji||'✳')}</span>`}<span class="badge">${esc(x.store||'A good find')}</span></a><button class="heart" title="Remove" data-remove="${esc(x.id)}">×</button><div class="meta"><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><div class="store">${esc(x.category||'Other')}</div><div class="price">${esc(x.price||'Price not listed')}</div></div></article>`).join(''):'<div class="empty">Nothing tucked away here yet. Find something lovely and add its link above.</div>';$('#count').textContent=`${items.length} ${items.length===1?'find':'finds'} saved`;$('#footer-count').textContent=`${items.length} finds saved`;$('#all-n').textContent=items.length?` ${items.length}`:''}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function domain(u){try{return new URL(u).hostname.replace(/^www\./,'').split('.')[0]}catch{return'Website'}}
$('#url-form').addEventListener('submit',async e=>{e.preventDefault();const url=$('#url-input').value.trim();if(!/^https?:\/\//i.test(url)){toast('Please enter a full product link');return}let title='',price='',image='';try{let r=await fetch('/api/metadata?url='+encodeURIComponent(url));if(r.ok){let d=await r.json();title=d.title||'';price=d.price||'';image=d.image||''}}catch{}$('#p-url').value=url;$('#p-title').value=title;$('#p-price').value=price;$('#p-image').value=image;$('#p-category').value='Other';$('#modal-back').classList.add('open');if(!title)$('#p-title').value=domain(url)+' find';});
$('#product-form').addEventListener('submit',e=>{e.preventDefault();let url=$('#p-url').value;let cat=$('#p-category').value;let emojis={Clothing:'👕',Bags:'👜',Accessories:'💍',Home:'🏺',Books:'📚',Other:'✳'};items.unshift({id:crypto.randomUUID(),url,title:$('#p-title').value.trim(),price:$('#p-price').value.trim(),image:$('#p-image').value.trim(),category:cat,store:domain(url),emoji:emojis[cat],tone:'#eeeae2'});save();$('#modal-back').classList.remove('open');$('#url-input').value='';toast('Added to your collection ✳')});$('#cancel').onclick=()=>$('#modal-back').classList.remove('open');$('#modal-back').onclick=e=>{if(e.target.id==='modal-back')e.currentTarget.classList.remove('open')};$('#categories').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};$('#grid').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){items=items.filter(x=>x.id!==b.dataset.remove);save();toast('Removed from your list')}};$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Page link copied')}catch{toast('Copy this page link from your browser')}};render();
</script></body></html>
